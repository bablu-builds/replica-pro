kind = "web"
previewPath = "/"
title = "RMAO Dashboard"
description = "A browser dashboard for starting mock RMAO runs, reviewing generated task plans, monitoring task progress, and inspecting sanitized run results."
version = "1.0.0"
id = "artifacts/rmao-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20657

[services.development]
run = "pnpm --filter @workspace/rmao-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rmao-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/rmao-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20657"
BASE_PATH = "/"
