[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rmao"
version = "0.1.0"
description = "Replit Multi-Agent Orchestrator"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "fastapi>=0.110",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "slowapi>=0.1.9",
    "streamlit>=1.32",
    "structlog>=24.0",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
openai = ["openai>=1.0"]

[project.scripts]
rmao = "rmao.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
