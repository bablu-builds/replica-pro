name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and development dependencies
        run: python -m pip install -e "replica-pro[dev]"

      - name: Run tests
        working-directory: replica-pro
        run: python -m pytest

      - name: Compile source
        run: python -m compileall -q replica-pro/src

      - name: Build Docker image
        run: docker build --tag replica-pro:ci .